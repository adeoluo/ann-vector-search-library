[project]
name = "ann-vector-search-library"
version = "0.3.0"
description = "An approximate nearest neighbor vector search library built from scratch in Python, implementing HNSW"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[dependency-groups]
# Rebuild the Rust core in place while editing it: make rust-develop
rust = [
    "maturin>=1.7,<2",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Optional, opt-in only: the independent recall comparison against hnswlib and
# FAISS in tests/test_library_parity.py and benchmarks/compare_libraries.py.
# Not installed by default CI and not required by the core library.
# Run with: uv sync --group validation && uv run pytest tests/test_library_parity.py
validation = [
    "hnswlib>=0.8",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The Rust core (rust/) is compiled into the package as `ann_vector_search_library.ann_vector_search_rs`,
# so every install uses it; the Python implementation stays as the reference.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "ann_vector_search_library.ann_vector_search_rs"
features = ["python"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ann_vector_search_library"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
