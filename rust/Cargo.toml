[package]
name = "ann-vector-search-rs"
version = "0.3.2"
edition = "2024"
description = "Rust core of ann-vector-search-library: HNSW construction and search, reproducing the Python index exactly"
license = "MIT"
authors = ["Adeolu Ogunnoiki"]
repository = "https://github.com/adeoluo/ann-vector-search-library"
publish = false

[lib]
name = "ann_vector_search_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml); plain `cargo test` needs no Python.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
rayon = "1.12"

[profile.release]
lto = true
codegen-units = 1
